name: Deploy Destria Tech Inc to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Verify clean URL routing architecture (source gate)
        run: npm run verify:routing

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Independent static & security lint
        run: npm run lint

      - name: Run full regression & security test suite
        run: npm test

      - name: Verify server build
        run: npm run build:server

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Build website
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.destriatech.com' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Verify no server secrets, Paste_* artifacts, localhost API URLs, legacy domains, or internal emails leaked into frontend bundle
        run: |
          if find public dist -type f -name 'Paste_*' | grep -q .; then
            echo "ERROR: Proprietary internal Paste_* prompt files found in public/ or dist/!"
            exit 1
          fi
          if grep -rnE "artaxsvcs@gmail\.com|dhenze\.languisan@gmail\.com|SUPABASE_SERVICE_ROLE_KEY|ADMIN_BOOTSTRAP_PASSWORD|ADMIN_SESSION_SECRET|PORTAL_SIGNING_SECRET|RESEND_API_KEY|GEMINI_API_KEY|GOOGLE_SERVICE_ACCOUNT|XENDIT_SECRET_KEY|PAYMONGO_SECRET_KEY|MAYA_SECRET_KEY|PAYPAL_CLIENT_SECRET|GOTYME_API_SECRET|CARD_GATEWAY_SECRET_KEY|api\.ophireummultimedia\.com|Desmond Hines" dist/; then
            echo "ERROR: Forbidden secret, legacy domain, outdated identity, or internal email detected in built frontend bundle!"
            exit 1
          fi
          if grep -rnE "http://localhost:3000|http://127\.0\.0\.1:3000" dist/assets/; then
            echo "ERROR: Hardcoded localhost API URL leaked into production dist/assets/!"
            exit 1
          fi

      - name: Verify compiled clean URL entries, 404 fallback, CNAME, and SEO artifacts
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/CNAME
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/ai-frontdesk/index.html
          test -f dist/portal/login/index.html
          test -f dist/portal/register/index.html
          test -f dist/portal/forgot-password/index.html
          test -f dist/portal/reset-password/index.html
          test -f dist/portal/verify-email/index.html
          test -f dist/portal/dashboard/index.html
          test -f dist/admin/login/index.html
          test -d dist/assets
          if grep -q '/src/main.tsx' dist/index.html; then exit 1; fi
          npm run verify:routing:dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
