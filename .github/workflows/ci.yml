name: CI Security & Stabilization Checks

on:
  push:
    branches: [main, 'repair/**', 'fix/**']
  pull_request:
    branches: [main, 'repair/**', 'fix/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Verify clean URL routing architecture (source regression gate)
        run: npm run verify:routing

      - name: TypeScript strict typecheck
        run: npm run typecheck

      - name: Independent static & security lint
        run: npm run lint

      - name: Build production frontend bundle, static routes & release manifest
        run: |
          npm run build
          npm run build:pages-routes
          npm run build:release-manifest

      - name: Verify compiled clean URL static routes, 404.html, CNAME, and SEO artifacts
        run: npm run verify:routing:dist

      - name: Verify zero secret, internal email, localhost API, sensitive file, or outdated identity leakage in dist/ bundle
        run: |
          if find public dist -type f \( -name 'Paste_*' -o -name '.env*' -o -name '*.pem' -o -name '*.key' -o -name '*.sql' -o -name '*.bak' -o -name '*.map' \) | grep -q .; then
            echo "ERROR: Prohibited sensitive or internal files found in public/ or dist/!"
            exit 1
          fi
          if grep -rnE "artaxsvcs@gmail\.com|dhenze\.languisan@gmail\.com|SUPABASE_SERVICE_ROLE_KEY|RESEND_API_KEY|GEMINI_API_KEY|ADMIN_BOOTSTRAP_PASSWORD|ADMIN_SESSION_SECRET|BACKUP_SIGNING_SECRET|PORTAL_SIGNING_SECRET|api\.ophireummultimedia\.com|Desmond Hines" dist/; then
            echo "ERROR: Forbidden secret, legacy domain, outdated identity, or internal notification email leaked into dist/ bundle!"
            exit 1
          fi
          if grep -rnE "http://localhost:3000|http://127\.0\.0\.1:3000" dist/assets/; then
            echo "ERROR: Hardcoded localhost API URL leaked into production dist/assets/!"
            exit 1
          fi
          echo "PASS: Zero forbidden secrets, sensitive artifacts, localhost API URLs, legacy domains, or internal emails in dist/."

      - name: Verify SQL migration hygiene (additive, idempotent, RLS enabled, 001-009)
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Checking $f"
            test -s "$f"
          done
          grep -q "claim_retryable_notifications" supabase/migrations/005_enterprise_production_readiness.sql
          grep -q "notification_webhook_events" supabase/migrations/005_enterprise_production_readiness.sql
          grep -q "portal_payment_refunds" supabase/migrations/005_enterprise_production_readiness.sql
          grep -q "Desmond Hinds" supabase/migrations/006_ceo_identity_correction.sql
          grep -q "frontdesk_project_inquiries" supabase/migrations/007_ai_frontdesk_platform.sql
          grep -q "frontdesk_pending_submissions" supabase/migrations/008_ai_frontdesk_durability_hardening.sql
          grep -q "idempotency_key" supabase/migrations/008_ai_frontdesk_durability_hardening.sql
          grep -q "dti_set_updated_at_timestamp" supabase/migrations/008_ai_frontdesk_durability_hardening.sql
          grep -q "admin_revoked_sessions" supabase/migrations/009_operational_hardening_and_durable_governance.sql
          grep -q "purge_expired_admin_revoked_sessions" supabase/migrations/009_operational_hardening_and_durable_governance.sql
          echo "PASS: SQL migrations 001-009 present and verified."

      - name: Run unit test suite
        run: npm run test:unit

      - name: Run integration test suite
        run: npm run test:integration

      - name: Run security regression test suite
        run: npm run test:security

      - name: Verify production server bundle compilation
        run: npm run build:server
