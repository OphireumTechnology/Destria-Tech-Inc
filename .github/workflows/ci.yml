name: CI Security & Stabilization Checks

on:
  push:
    branches: [main, 'repair/**', 'fix/**']
  pull_request:
    branches: [main, 'repair/**', 'fix/**']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Verify clean URL routing architecture (source regression gate)
        run: npm run verify:routing

      - name: TypeScript typecheck & lint
        run: npm run lint

      - name: Build production frontend bundle
        run: npm run build

      - name: Verify compiled clean URL static routes, 404.html, CNAME, and SEO artifacts
        run: npm run verify:routing:dist

      - name: Verify zero secret or internal notification email leakage in dist/ bundle
        run: |
          if grep -rnE "artaxsvcs@gmail\.com|dhenze\.languisan@gmail\.com|SUPABASE_SERVICE_ROLE_KEY|RESEND_API_KEY|ADMIN_BOOTSTRAP_PASSWORD|ADMIN_SESSION_SECRET" dist/; then
            echo "ERROR: Forbidden secret or internal notification email leaked into dist/ bundle!"
            exit 1
          fi
          echo "PASS: Zero forbidden secrets or internal notification emails in dist/."

      - name: Verify SQL migration hygiene (additive, idempotent, RLS enabled)
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Checking $f"
            test -s "$f"
          done
          grep -q "claim_retryable_notifications" supabase/migrations/005_enterprise_production_readiness.sql
          grep -q "notification_webhook_events" supabase/migrations/005_enterprise_production_readiness.sql
          grep -q "portal_payment_refunds" supabase/migrations/005_enterprise_production_readiness.sql
          echo "PASS: SQL migrations present and verified."

      - name: Run unit, integration, routing & security regression suite
        run: npm test

      - name: Verify server bundle compilation
        run: npm run build:server
